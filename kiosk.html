<title>入退室記録</title>

     PAVLOVのアイコンを富士学院のiPadに出すわけにいかないため。 -->
<link rel="apple-touch-icon" href="icon-kiosk-180.png">
<link rel="icon" href="icon-kiosk-192.png">

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

<!--
  ============================================================
  入退室記録（教室のiPadに置きっぱなしにする打刻画面）
  PAVLOV Connect と同じ Supabase を使う。保護者への通知は
  Connect 側のトリガーが自動で行うので、この画面には通知処理は無い。

  【この画面の設計で気をつけたこと】
   ・入室モードと退室モードを分ける。退室モードは戻し忘れが起きるので
     60秒さわらなければ自動で入室モードへ戻す（1人退室したら8秒で戻す）。
   ・入室モードでは在室中の人、退室モードでは未入室の人をタップできない。
     これで二度押しと逆打刻が構造的に起きない。
   ・在室中の人は「押せない」だけで薄くしない。この画面は打刻装置であると
     同時に「今だれが来ているか」の掲示板でもあるため。
   ・生徒名はこのファイルに書かない。必ず Connect の名簿から読む。
  ============================================================
-->
<style>
/* ─────────────────────────────────────────────
   配色は 白:赤:黒 = 7:2:1
     白 … 背景・タイル・余白（画面のほとんど）
     赤 … ロゴ／在室中のタイル／選択中の学年／モード切替ボタン
     黒 … 文字と細い罫線。面で使うのは「退室モード」のヘッダーだけ
   富士学院版は赤の代わりに紺が入る（data-brand="fuji"）
   ───────────────────────────────────────────── */
:root{
  --brand:#c30d23;      /* PAVLOVレッド */
  --brand-dark:#950006;
  --pale:#fbeef0;
  --ink:#111;           /* 黒 */
  --sub:#6b6b6b;
  --line:#dcdcdc;
}
:root[data-brand="fuji"]{
  --brand:#0f3b7d; --brand-dark:#0a2a5c; --pale:#edf1f8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overscroll-behavior:none}
/* 【重要】フォントの並び順。Noto Sans JPが読めなかったとき、
   日本語フォントを明示しておかないと中国語の字形（時・海・直など）で出てしまう。
   iPad/Mac＝ヒラギノ、Windows＝游ゴシック/メイリオ、が受け皿。 */
body{font-family:"Noto Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic Medium","Meiryo",system-ui,sans-serif;color:var(--ink);background:#fff;
     -webkit-user-select:none;user-select:none}
button{border-radius:0;appearance:none;font-family:inherit}

.wrap{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden;background:#fff}

/* ── ヘッダー：白地＋赤の細い下線。退室モードだけ黒帯に反転する ── */
.bar{flex:0 0 auto;background:#fff;color:var(--ink);display:flex;align-items:center;gap:14px;
     padding:10px 20px;padding-top:calc(10px + env(safe-area-inset-top));
     border-bottom:3px solid var(--brand)}
.bar.out{background:var(--ink);color:#fff;border-bottom-color:var(--ink)}
.logo{height:30px;width:auto;display:block}
.bar.out .logo{filter:brightness(0) invert(1)}   /* 黒帯では白抜きにする */
.logotext{font-size:20px;font-weight:700;letter-spacing:.08em;color:var(--brand)}
.bar.out .logotext{color:#fff}
.icon{background:none;border:0;color:var(--sub);font-size:22px;line-height:1;padding:6px 8px;cursor:pointer}
.bar.out .icon{color:#fff}
.roomsw{cursor:pointer;font-weight:700;font-size:15px;color:var(--sub)}
.bar.out .roomsw{color:#fff}
.right{margin-left:auto;display:flex;align-items:center;gap:14px}
.modename{font-size:18px;font-weight:700;letter-spacing:.04em;color:var(--brand)}
.bar.out .modename{color:#fff}
.modebtn{background:var(--brand);color:#fff;border:0;padding:11px 20px;font-size:16px;font-weight:700;cursor:pointer}
.bar.out .modebtn{background:#fff;color:var(--ink)}

/* ── 学年タブ：白地。選ばれているものだけ赤 ── */
.tabs{flex:0 0 auto;display:flex;background:#fff;border-bottom:1px solid var(--line)}
/* 退室モードのときだけ出る黒い指示バー。
   【なぜ足したか】ヘッダーの反転だけでは「今どちらのモードか」に気づかない人がいる。
   生徒が読める言葉で1行出すのが、色を増やさずにいちばん確実。 */
.hint{display:none}
.wrap.out .hint{display:block;flex:0 0 auto;background:var(--ink);color:#fff;text-align:center;
  padding:11px 8px;font-size:18px;font-weight:700;letter-spacing:.08em}
.tab{flex:1;background:#fff;color:var(--sub);border:0;border-bottom:4px solid transparent;
     padding:14px 4px;cursor:pointer}
.tab .g{font-size:24px;font-weight:700;letter-spacing:.06em}
.tab[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--brand)}

/* ── 名前タイル：白地＋細い罫線。在室中だけ赤で塗る ── */
.grid{flex:1 1 auto;overflow-y:auto;display:grid;grid-template-columns:repeat(5,1fr);
      gap:10px;padding:14px;align-content:start;background:#fff;-webkit-overflow-scrolling:touch}
.tile{position:relative;background:#fff;border:1px solid var(--line);color:var(--ink);
      min-height:104px;padding:16px 8px 12px;font-size:27px;font-weight:500;cursor:pointer;
      display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15}
.tile .t{font-size:13px;font-weight:400;margin-top:6px;color:var(--sub)}
.tile.in{background:var(--brand);border-color:var(--brand);color:#fff}
.tile.in .t{color:rgba(255,255,255,.85)}
.tile:active{filter:brightness(.94)}
.tile.na{opacity:.4}
/* 在室中は押せないだけで薄くしない（「今だれが来ているか」の掲示板を兼ねるため） */
.tile.in.na{opacity:1}
.tile .flag{position:absolute;top:4px;left:0;right:0;font-size:12px;font-weight:700;color:var(--brand)}
.tile.in .flag{color:#fff}
.empty{padding:28px;color:var(--sub)}

/* ── フッター：白地＋細い上線 ── */
.foot{flex:0 0 auto;background:#fff;color:var(--sub);font-size:14px;display:flex;align-items:center;
      gap:16px;padding:10px 20px;padding-bottom:calc(10px + env(safe-area-inset-bottom));
      border-top:1px solid var(--line)}
.foot .clock{margin-left:auto;font-size:18px;font-weight:700;letter-spacing:.05em;color:var(--ink)}

/* ── トースト：入室は赤、退室は黒 ── */
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%) translateY(20px);
       background:var(--brand);color:#fff;padding:16px 30px;font-size:22px;font-weight:700;text-align:center;
       opacity:0;pointer-events:none;transition:.18s;z-index:20}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.out{background:var(--ink)}
.toast.warn{background:#4a4a4a}

/* ── ログイン・メニュー ── */
.center{flex:1;display:flex;align-items:center;justify-content:center;padding:24px;background:#fff}
.card{width:100%;max-width:400px;text-align:center}
.card .logo{height:38px;margin:0 auto 10px}
.card h1{font-size:15px;margin:0 0 24px;color:var(--sub);font-weight:400;letter-spacing:.08em}
.card input{width:100%;font-size:17px;padding:14px;margin-bottom:12px;border:1px solid var(--line);
            font-family:inherit;text-align:left}
.card input:focus{outline:2px solid var(--brand);outline-offset:-2px}
.card .go{width:100%;font-size:17px;font-weight:700;padding:16px;background:var(--brand);color:#fff;
          border:0;cursor:pointer}
.err{color:var(--brand);font-size:14px;margin-bottom:12px;min-height:1.2em}

.menu{position:fixed;inset:0;background:rgba(17,17,17,.45);z-index:30;display:flex;
      align-items:center;justify-content:center}
.menu .box{background:#fff;padding:24px;width:min(92vw,380px)}
.menu button{display:block;width:100%;text-align:left;font-size:17px;padding:14px;margin-bottom:8px;
             background:#fff;color:var(--ink);border:1px solid var(--line);cursor:pointer}
.menu button:active{background:var(--pale)}
.menu .who{font-size:13px;color:var(--sub);margin-bottom:14px;word-break:break-all}

@media (max-width:760px){
  .grid{grid-template-columns:repeat(3,1fr);gap:8px;padding:10px}
  .tile{font-size:20px;min-height:88px}
  .tab .g{font-size:19px}
  .logo{height:24px}
}
@media (max-width:430px){
  .grid{grid-template-columns:repeat(2,1fr)}
  .modename{display:none}
}
</style>
</head>

function logoHtml(h){
  var fuji = isFuji();
  return '<img class="logo" src="' + (fuji ? LOGO_FUJI : LOGO_PAVLOV) +
         '" alt="' + (fuji ? '富士学院' : 'PAVLOV') + '" style="height:' + h + 'px">';

// ── ブランド（教室名で判定。Connect と同じ挙動）──
// URLに fuji が含まれていれば富士学院。教室が分かる前（ログイン画面）でも
// 富士学院のiPadにPAVLOVの赤を一瞬たりとも出さないため。
function fujiByUrl(){
  return (location.hostname + location.pathname).toLowerCase().indexOf('fuji') >= 0;
}
function isFuji(){
  // 教室が分かればそれを優先。分かる前（ログイン画面）はURLで判定し、
  // 富士学院のiPadにPAVLOVのロゴや赤を一瞬たりとも出さない。
  return room ? (String(room).indexOf('富士学院') >= 0) : fujiByUrl();
}
function applyBrand(){
  var fuji = isFuji();
  document.documentElement.setAttribute('data-brand', fuji ? 'fuji' : 'pavlov');
  var m = document.querySelector('meta[name="theme-color"]');
  if(!m){ m = document.createElement('meta'); m.name='theme-color'; document.head.appendChild(m); }
  m.content = '#1f2430';   // 画面の外枠は中立色。中身の色だけブランドで変える
}

// ── ログイン画面 ──
function viewLogin(msg){
  $('app').innerHTML =
    '<div class="wrap"><div class="center"><div class="card">'+
    logoHtml(38)+
    '<h1>入退室記録</h1>'+
    '<div class="err" id="err">'+esc(msg||'')+'</div>'+
    '<input id="mail" type="email" inputmode="email" autocomplete="username" placeholder="メールアドレス">'+
    '<input id="pass" type="password" autocomplete="current-password" placeholder="パスワード">'+
    '<button class="go" id="go">ログイン</button>'+
    '</div></div></div>';
  $('go').onclick = async function(){
    $('err').textContent = '';
    var r = await sb.auth.signInWithPassword({ email: $('mail').value.trim(), password: $('pass').value });
    if(r.error){ $('err').textContent = 'ログインできませんでした。メールアドレスとパスワードを確認してください。'; }
  };
}

// ── 名簿・在室状況の読み込み ──
async function loadBoard(){
  var r = await sb.rpc('attendance_board');
  if(r.error) throw r.error;
  board = r.data || [];
  var rooms = [];
  board.forEach(function(s){ if(rooms.indexOf(s.classroom_name)<0) rooms.push(s.classroom_name); });
  if(!room || rooms.indexOf(room)<0) room = rooms[0] || null;
  applyBrand();
  return rooms;
}

function rows(){ return board.filter(function(s){ return s.classroom_name === room; }); }
// 起動直後に開く学年。人数が最も多い学年にする。
// 【なぜ】GRADES順の先頭だと、富士学院では1名しかいない「小4」が最初に出てしまう。
// 生徒が来て最初に探すのは、いちばん人数の多い学年である可能性が高い。
function defaultGrade(){
  var count = {};
  rows().forEach(function(s){ var g = s.grade||''; count[g] = (count[g]||0)+1; });
  var gs = gradesInUse(), best = gs[0], bestN = -1;
  gs.forEach(function(g){ if((count[g]||0) > bestN){ bestN = count[g]||0; best = g; } });
  return best;
}
function gradesInUse(){
  var set = {}; rows().forEach(function(s){ set[s.grade||''] = 1; });
  var list = GRADES.filter(function(g){ return set[g]; });
  if(set['']) list.push('');
  return list.length ? list : [''];
}
function isIn(s){ return s.last_kind === 'in'; }

// ── メイン画面 ──
function viewMain(rooms){
  $('app').innerHTML =
    '<div class="wrap" id="wrap">'+
      '<div class="bar" id="bar">'+
        logoHtml(30)+
        '<button class="icon" id="gear" title="設定">⚙</button>'+
        '<button class="icon" id="reload" title="最新に更新">⟳</button>'+
        (rooms.length>1 ? '<span class="roomsw" id="roomsw">'+esc(room)+' ▾</span>' : '')+
        '<div class="right">'+
          '<span class="modename" id="modename">入室モード</span>'+
          '<button class="modebtn" id="modebtn">モード切替</button>'+
        '</div>'+
      '</div>'+
      '<div class="tabs" id="tabs"></div>'+
      '<div class="hint">退室モード　―　帰る人をタップしてください</div>'+
      '<div class="grid" id="grid"></div>'+
      '<div class="foot">'+
        '<span id="date"></span><span>'+esc(room||'')+'</span>'+
        '<span id="incount"></span>'+
        '<span class="clock" id="clock"></span>'+
      '</div>'+
      '<div class="toast" id="toast"></div>'+
    '</div>';
  $('modebtn').onclick = toggleMode;
  $('gear').onclick = openMenu;
  $('reload').onclick = async function(){ await refresh(); toast('最新にしました','warn'); };
  if($('roomsw')) $('roomsw').onclick = function(){
    var i = rooms.indexOf(room); room = rooms[(i+1)%rooms.length]; applyBrand(); viewMain(rooms);
  };
  drawTabs(); drawGrid(); applyMode(); tick();
}

function drawTabs(){
  var gs = gradesInUse();
  if(gs.indexOf(grade) < 0) grade = defaultGrade();
  $('tabs').innerHTML = gs.map(function(g){
    return '<button class="tab" role="tab" aria-selected="'+(g===grade)+'" data-g="'+esc(g)+'">'+
           '<div class="g">'+esc(g||'未設定')+'</div></button>'; }).join('');
  Array.prototype.forEach.call($('tabs').querySelectorAll('.tab'), function(t){
    t.onclick = function(){ grade = t.dataset.g; drawTabs(); drawGrid(); };
  });
}

function drawGrid(){
  var list = rows().filter(function(s){ return (s.grade||'') === grade; })
    .sort(function(a,b){ return String(a.name_kana||a.student_name)
      .localeCompare(String(b.name_kana||b.student_name),'ja'); });
  // 講師が「今だれが来ているか」を見る掲示板も兼ねるので、在室人数を常に出しておく
  var nIn = rows().filter(isIn).length;
  var ic = $('incount');
  if(ic) ic.innerHTML = '在室 <b style="color:var(--brand);font-size:16px">'+nIn+'</b> 人';
  $('grid').innerHTML = list.map(function(s){
    var inRoom = isIn(s);
    var canTap = (mode==='in') ? !inRoom : inRoom;
    var t = s.last_at ? hhmm(new Date(s.last_at)) : '';
    var time = inRoom && t ? '<span class="t">'+t+' 入室</span>' : '';
    var flag = s.absence_kind
      ? '<span class="flag">'+({absent:'欠席連絡',late:'遅刻連絡',early:'早退連絡'}[s.absence_kind]||'')+'</span>'
      : '';
    return '<button class="tile'+(inRoom?' in':'')+(canTap?'':' na')+'" data-id="'+esc(s.student_id)+'">'+
           flag+'<span>'+esc(s.student_name)+'</span>'+time+'</button>';
  }).join('') || '<div class="empty">この学年の生徒がいません</div>';
  Array.prototype.forEach.call($('grid').querySelectorAll('.tile'), function(el){
    el.onclick = function(){
      var s = board.filter(function(x){ return String(x.student_id)===el.dataset.id; })[0];
      if(s) punch(s);
    };
  });
}

// ── モード ──
function toggleMode(){ mode = (mode==='in'?'out':'in'); applyMode(); armAutoBack(60000); }
function applyMode(){
  var bar = $('bar'); if(!bar) return;
  bar.classList.toggle('out', mode==='out');
  var w = $('wrap'); if(w) w.classList.toggle('out', mode==='out');
  $('modename').textContent = (mode==='in') ? '入室モード' : '退室モード';
  drawGrid();
}
function armAutoBack(ms){
  clearTimeout(modeTimer);
  if(mode!=='out') return;
  modeTimer = setTimeout(function(){ mode='in'; applyMode(); toast('入室モードに戻りました','warn'); }, ms);
}

// ── 打刻 ──
async function punch(s){
  var now = Date.now();
  var goingIn = (mode==='in');
  // 【なぜ無反応にしないか】押しても何も起きないと、生徒は押せたのか分からず連打する。
  // 押せない場合は必ず理由を出す。
  if(goingIn && s.last_kind === 'in'){
    toast(s.student_name + ' さんは すでに入室しています','warn'); return;
  }
  if(!goingIn && s.last_kind !== 'in'){
    toast(s.student_name + ' さんは まだ入室していません','warn'); return;
  }
  if(lockUntil[s.student_id] && now < lockUntil[s.student_id]){
    toast('少しお待ちください','warn'); return;   // 二度押しロック中
  }
  lockUntil[s.student_id] = now + 5000;
  var r = await sb.rpc('record_attendance', {
    p_student_ref: s.student_id,
    p_kind: goingIn ? 'in' : 'out',
    p_method: 'manual',
    p_source_ref: deviceId + '-' + now
  });
  if(r.error){
    lockUntil[s.student_id] = 0;
    toast('記録できませんでした（' + (r.error.message||'通信エラー') + '）','warn');
    return;
  }
  s.last_kind = goingIn ? 'in' : 'out';
  s.last_at = new Date().toISOString();
  drawGrid();
  toast(s.student_name + ' さん　' + (goingIn?'入室':'退室') + '　' + hhmm(new Date()), goingIn?'in':'out');
  if(!goingIn) armAutoBack(8000);
}

// ── 小物 ──
function toast(msg, kind){
  var el = $('toast'); if(!el) return;
  el.textContent = msg;
  el.className = 'toast show' + (kind==='out' ? ' out' : kind==='warn' ? ' warn' : '');
  clearTimeout(el._t);
  el._t = setTimeout(function(){ el.className='toast'; }, 1800);
}
function tick(){
  var c = $('clock'), d = $('date'); if(!c||!d) return;
  var n = new Date(), w = ['日','月','火','水','木','金','土'][n.getDay()];
  c.textContent = hhmm(n);
  d.textContent = n.getFullYear()+'年'+(n.getMonth()+1)+'月'+n.getDate()+'日（'+w+'）';
}
setInterval(tick, 1000);

async function refresh(){
  try{ var rooms = await loadBoard(); drawTabs(); drawGrid(); return rooms; }catch(e){ return null; }
}

function openMenu(){
  var el = document.createElement('div');
  el.className = 'menu';
  el.innerHTML = '<div class="box">'+
    '<div class="who" id="who"></div>'+
    '<button id="m-reload">名簿を読み直す</button>'+
    '<button id="m-out">ログアウト</button>'+
    '<button id="m-close">閉じる</button></div>';
  document.body.appendChild(el);
  sb.auth.getUser().then(function(r){
    var u = r && r.data && r.data.user;
    var w = el.querySelector('#who');
    if(w) w.textContent = u ? ('ログイン中: '+u.email) : '';
  });
  el.onclick = function(e){ if(e.target===el) el.remove(); };
  el.querySelector('#m-close').onclick = function(){ el.remove(); };
  el.querySelector('#m-reload').onclick = async function(){ el.remove(); await refresh(); toast('最新にしました','warn'); };
  el.querySelector('#m-out').onclick = async function(){ el.remove(); await sb.auth.signOut(); };
}

// ── 起動 ──
async function boot(){
  var rooms;
  try{ rooms = await loadBoard(); }
  catch(e){
    $('app').innerHTML = '<div class="wrap"><div class="center"><div class="card">'+
      '<h1>名簿を読み込めませんでした</h1><div class="err">'+esc(e.message||'')+'</div>'+
      '<button class="go" onclick="location.reload()">もう一度</button></div></div></div>';
    return;
  }
  viewMain(rooms);
  // 名簿と在室状況を5分ごとに読み直す（他の端末やConnect側の変更を拾う）
  clearInterval(reloadTimer);
  reloadTimer = setInterval(refresh, 5*60*1000);
  // 別のiPadやスタッフPCの打刻をすぐ反映する
  try{
    sb.channel('kiosk-att')
      .on('postgres_changes', {event:'INSERT', schema:'public', table:'attendance_logs'}, function(){
        clearTimeout(window.__rt); window.__rt = setTimeout(refresh, 1200);
      }).subscribe();
  }catch(e){}
}

applyBrand();   // ログイン画面を出す前にURLで色を決める
sb.auth.onAuthStateChange(function(_e, session){
  if(session && session.user) boot(); else viewLogin();
});
sb.auth.getSession().then(function(r){
  if(r && r.data && r.data.session) boot(); else viewLogin();
});

})();
</script>
</body>
</html>
