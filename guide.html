.bar{position:sticky;top:0;background:#fff;border-bottom:1px solid #ddd;padding:10px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:13px}
.bar button{border:1px solid var(--c);background:var(--c);color:#fff;padding:8px 16px;font:inherit;font-weight:700;cursor:pointer}
.bar .sec{background:#fff;color:#111;border-color:#bbb}

.top{border-top:3px solid var(--c);padding-top:6mm;display:flex;align-items:center;justify-content:space-between}
.top img{height:15mm}.top img.sq{height:22mm}

h2{font-size:11pt;letter-spacing:.14em;margin:0 0 3mm;padding-left:3mm;border-left:3px solid var(--c);line-height:1.2}
.to{margin:4mm 0 1.5mm;font-size:11.5pt;font-weight:700}
.lead{margin:0 0 4mm;font-size:10pt}
.grid{display:grid;grid-template-columns:1fr 62mm;gap:7mm;align-items:start}
.qrbox{border:1px solid #e3e3e3;padding:5mm;text-align:center}.qrbox img{width:46mm;height:46mm;display:block;margin:0 auto 2mm}.qrbox .u{font-size:9pt;word-break:break-all;font-weight:700}.qrbox .s{font-size:8pt;color:#666;margin-top:1mm}
.code{border:1.5px solid #111;padding:3mm 4mm;margin-top:5mm;text-align:center}
.code .l{font-size:8.5pt;letter-spacing:.12em;color:var(--c);font-weight:700;text-align:left}
.code .v{font-family:ui-monospace,Menlo,monospace;font-size:19pt;font-weight:700;letter-spacing:.12em;color:var(--c);margin:2mm 0 1mm;white-space:nowrap}
.code .n{font-size:7.5pt;color:#666;text-align:left}
ol.steps{list-style:none;padding:0;margin:0}ol.steps li{display:flex;gap:4mm;padding:2.1mm 0;border-bottom:1px solid #eee}ol.steps li:last-child{border-bottom:0}
ol.steps .n{flex:0 0 8mm;height:8mm;background:var(--c);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:11pt}
ol.steps .tt{font-weight:700;font-size:10.5pt}ol.steps .d{font-size:9.5pt;color:#333;margin-top:.5mm}
.two{display:grid;grid-template-columns:1fr 1fr;gap:6mm;margin-top:4mm}.box{border:1px solid #e3e3e3;padding:3mm 5mm}.box h3{margin:0 0 2mm;font-size:9.5pt;letter-spacing:.08em;color:var(--c)}.box p{margin:0;font-size:9pt;color:#333}
.faq{margin-top:4mm}.faq .items{display:grid;grid-template-columns:1fr 1fr;gap:2.5mm 6mm}.faq .it{border-top:1px solid #eee;padding-top:2mm}
.faq dt{font-weight:700;font-size:9pt}.faq dt::before{content:"Q ";color:var(--c)}.faq dd{margin:.5mm 0 0;font-size:8.5pt;color:#333}
.foot{position:absolute;left:16mm;right:16mm;bottom:10mm;border-top:1px solid #111;padding-top:3mm;display:flex;justify-content:space-between;align-items:flex-end}
.foot .c{font-size:9pt}.foot .c b{letter-spacing:.06em}.foot .line{display:inline-block;border-bottom:1px solid #999;min-width:52mm;height:5mm;vertical-align:bottom;margin-left:2mm}.foot .r{font-size:7.5pt;color:#888;text-align:right}
@media print{.bar{display:none}html,body{background:#fff}.sheet{margin:0;box-shadow:none;width:210mm;min-height:auto;height:297mm;overflow:hidden}}
@media screen and (max-width:800px){.sheet{width:100%;padding:8mm;min-height:auto}.grid{grid-template-columns:1fr}.faq .items{grid-template-columns:1fr}.foot{position:static;margin-top:8mm}}
</style></head><body>

<p class="lead">${esc(b.org)}では、塾からのお知らせ・先生とのメッセージ・欠席連絡・入退室のお知らせを、保護者用アプリ「${esc(b.app)}」でお届けします。下の手順で登録をお願いいたします（所要時間 約3分・無料）。</p>
<div class="grid"><div><h2>登録手順</h2><ol class="steps">
<li><div class="n">1</div><div><div class="tt">QRコードを読み取り、アプリを開く</div><div class="d">スマートフォンのカメラで右のQRコードを読み取るか、URLを入力してください。アプリのインストールは不要です。</div></div></li>
<li><div class="n">2</div><div><div class="tt">「新規登録」を押す</div><div class="d">お名前・メールアドレス・パスワード（8文字以上）を入力します。</div></div></li>

<li><div class="n">4</div><div><div class="tt">ホーム画面に追加する（おすすめ）</div><div class="d">次回からアプリのようにワンタップで開けます。方法は下記をご覧ください。</div></div></li>
</ol></div>

<div class="two"><div class="box"><h3>iPhone の場合</h3><p>Safari でアプリを開く → 画面下の「共有」ボタン（□に↑）→「ホーム画面に追加」→「追加」</p></div><div class="box"><h3>Android の場合</h3><p>Chrome でアプリを開く → 右上のメニュー（︙）→「ホーム画面に追加」→「追加」</p></div></div>
<div class="faq"><h2>よくあるご質問</h2><div class="items">
<div class="it"><dt>招待コードを入れずに登録してしまった</dt><dd>ログイン後に「お子さまを登録」画面が出ます。そこでコードを入力してください。</dd></div>
<div class="it"><dt>兄弟姉妹がいる</dt><dd>1人目の登録後、「設定」→「お子さまを追加」から2人目のコードを入力。1つのアカウントで切り替えて見られます。</dd></div>
<div class="it"><dt>「招待コードが無効」と表示される</dt><dd>有効期限切れ、または使用済みです。教室までご連絡ください。再発行いたします。</dd></div>
<div class="it"><dt>パスワードを忘れた</dt><dd>ログイン画面の「パスワードを忘れた方」から、登録メールアドレス宛に再設定リンクをお送りします。</dd></div>
<div class="it"><dt>欠席・遅刻の連絡はどうする？</dt><dd>お子さまのメッセージ画面の下の「欠席連絡」「遅刻連絡」「早退連絡」ボタンから送れます。</dd></div>
<div class="it"><dt>通知は届く？</dt><dd>現在はアプリを開いたときに新着が表示されます。プッシュ通知は今後対応予定です。</dd></div>
